<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier - Loyalty</title>
    <style>
        /* ============ CSS VARIABLES ============ */
        :root {
            --bg-page: #f7f7f7;
            --bg-app: #ffffff;
            --bg-hero-1: #000000;
            --bg-hero-2: #1a1a1a;
            --text-primary: #111111;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --card-gray: #f1f1f1;
            --card-gray-hover: #e9e9e9;
            --border-light: #e5e7eb;
            --green: #22c55e;
            --green-soft: rgba(34, 197, 94, 0.12);
            --red: #ef4444;
            --radius-hero: 36px;
            --radius-card: 24px;
            --radius-btn: 999px;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-nav: 0 8px 30px rgba(0, 0, 0, 0.25);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        /* ============ RESET & BASE ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        /* ============ IPHONE FRAME ============ */
        .phone-frame {
            position: relative;
            width: 100%;
            max-width: 390px;
            height: 844px;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        @media (min-width: 480px) {
            body { padding: 24px; }
            .phone-frame {
                border-radius: 50px;
                border: 10px solid #000;
                box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            }
            /* Dynamic island */
            .phone-frame::before {
                content: '';
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                width: 120px;
                height: 32px;
                background: #000;
                border-radius: 999px;
                z-index: 100;
                pointer-events: none;
            }
        }
        /* ============ SCROLL AREA ============ */
        .app-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 48px 16px 110px;
            scrollbar-width: none;
        }
        .app-scroll::-webkit-scrollbar { display: none; }
        @media (max-width: 479px) {
            .app-scroll { padding-top: 20px; }
        }
        /* ============ HERO CARD ============ */
        .hero-card {
            position: relative;
            background: linear-gradient(to bottom, var(--bg-hero-1), var(--bg-hero-2));
            border-radius: var(--radius-hero);
            padding: 22px 20px 26px;
            box-shadow: var(--shadow-card);
            color: #fff;
        }
        .hero-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 26px;
        }
        .store-block { display: flex; flex-direction: column; gap: 3px; }
        .store-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .cashier-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.45);
        }
        .today-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            padding: 7px 14px;
            border-radius: var(--radius-btn);
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .today-pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
        }
        .hero-heading {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .hero-sub {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.55);
            font-weight: 500;
        }
        /* ============ FORM AREA ============ */
        .form-section { margin-top: 24px; }
        .field-group { margin-bottom: 18px; }
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--card-gray);
            border: 2px solid transparent;
            border-radius: 20px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .input-wrap:focus-within {
            border-color: #111;
            background: #fff;
        }
        .input-wrap.error { border-color: var(--red); }
        .input-prefix {
            padding-left: 18px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-muted);
            user-select: none;
        }
        .big-input {
            width: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            padding: 18px;
            outline: none;
            letter-spacing: 0.02em;
        }
        .big-input::placeholder {
            color: #c0c4cc;
            font-weight: 500;
        }
        /* Quick Bill Presets */
        .quick-presets {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .preset-chip {
            flex: 1;
            padding: 10px;
            background: var(--card-gray);
            border: 2px solid transparent;
            border-radius: 14px;
            font-weight: 600;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .preset-chip:hover {
            background: var(--card-gray-hover);
            border-color: #111;
        }
        /* Customer lookup result under phone field */
        .lookup-result {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 0 4px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .lookup-result.visible { display: flex; }
        .lookup-result .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }
        .lookup-result.new-customer { color: var(--text-secondary); }
        .lookup-result.new-customer .dot { background: var(--text-muted); }
        /* Friendly inline error */
        .field-error {
            display: none;
            margin-top: 8px;
            padding: 0 4px;
            font-size: 13px;
            font-weight: 500;
            color: var(--red);
        }
        .field-error.visible { display: block; }
        /* Live preview line */
        .preview-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 2px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .preview-line strong { color: var(--text-primary); }
        .preview-line .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }
        /* Big confirm button */
        .confirm-btn {
            width: 100%;
            padding: 19px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .confirm-btn:hover:not(:disabled) { background: #333; }
        .confirm-btn:active:not(:disabled) { transform: scale(0.97); }
        .confirm-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
        }
        /* Reward-ready pill */
        .reward-pill {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 16px;
            padding: 14px 16px;
            background: var(--green-soft);
            border-radius: 18px;
        }
        .reward-pill.visible { display: flex; }
        .reward-pill-left {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .reward-pill .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        .redeem-btn {
            padding: 9px 18px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .redeem-btn:hover { background: #333; }
        .redeem-btn:active { transform: scale(0.94); }
        /* Pulsing green dot */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        /* ============ SUCCESS STATE ============ */
        .success-card {
            display: none;
            text-align: center;
            padding: 36px 24px 28px;
            background: var(--card-gray);
            border-radius: var(--radius-card);
            margin-top: 24px;
        }
        .success-card.visible { display: block; }
        .success-check {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .success-check svg { width: 32px; height: 32px; color: #fff; }
        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .success-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .success-sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 24px;
        }
        .success-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .next-btn {
            width: 100%;
            padding: 17px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .next-btn:hover { background: #333; }
        .next-btn:active { transform: scale(0.97); }
        .undo-btn {
            width: 100%;
            padding: 13px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border-radius: 14px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .undo-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
        .undo-btn.hidden { display: none; }
        .undo-countdown {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        /* ============ TODAY'S ACTIVITY ============ */
        .activity-section { margin-top: 28px; }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card-gray);
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .activity-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .activity-icon svg { width: 17px; height: 17px; color: #555; }
        .activity-info { flex: 1; min-width: 0; }
        .activity-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .activity-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .activity-points {
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .activity-points.negative { color: var(--text-muted); }
        .empty-note {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        /* ============ BOTTOM NAV ============ */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 76%;
            max-width: 280px;
            z-index: 40;
        }
        .nav-pill {
            background: rgba(18, 18, 20, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-btn);
            padding: 10px 14px;
            box-shadow: var(--shadow-nav);
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .nav-btn {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255,255,255,0.45);
            transition: color 0.25s ease;
        }
        .nav-btn svg {
            width: 22px;
            height: 22px;
            position: relative;
            z-index: 1;
            transition: transform 0.2s ease;
        }
        .nav-btn:hover svg { transform: translateY(-1px); }
        .nav-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.16);
            transform: scale(0);
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }
        .nav-btn.active { color: #fff; }
        .nav-btn.active::before {
            transform: scale(1);
            opacity: 1;
        }
        /* ============ BOTTOM SHEET ============ */
        .sheet-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .sheet-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 28px 28px 0 0;
            padding: 12px 24px 36px;
            z-index: 70;
            transform: translateY(105%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #ddd;
            border-radius: 999px;
            margin: 0 auto 20px;
            cursor: grab;
        }
        .sheet-title {
            font-size: 19px;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .sheet-subtitle {
            font-size: 14px;
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .sheet-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            text-align: center;
            text-decoration: none;
        }
        .sheet-btn:hover { background: #333; }
        .sheet-btn:active { transform: scale(0.97); }
        .sheet-btn.secondary {
            background: none;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .sheet-btn.secondary:hover { background: var(--card-gray); color: var(--text-primary); }
        /* ============ REDUCED MOTION ============ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        /* ============ GATE (login / phone entry) ============ */
        .gate { position:absolute; inset:0; z-index:90; background:var(--bg-app); display:flex; align-items:center; padding:24px; }
        .gate.hidden { display:none; }
        .gate-card { width:100%; background:linear-gradient(to bottom,#000,#1a1a1a); border-radius:36px; padding:32px 24px 28px; color:#fff; box-shadow:0 4px 20px rgba(0,0,0,.08); }
        .gate-title { font-size:26px; font-weight:700; text-align:center; letter-spacing:-.02em; }
        .gate-sub { margin:8px 0 24px; text-align:center; font-size:14px; color:rgba(255,255,255,.55); line-height:1.5; }
        .gate-input { width:100%; padding:16px 18px; margin-bottom:12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:18px; color:#fff; font-size:17px; font-family:inherit; outline:none; transition:border-color .2s ease; }
        .gate-input:focus { border-color:rgba(255,255,255,.4); }
        .gate-input::placeholder { color:rgba(255,255,255,.35); }
        .gate-error { min-height:20px; margin-bottom:8px; font-size:13px; color:#f87171; text-align:center; line-height:1.4; }
        .gate-btn { width:100%; padding:16px; background:#fff; color:#000; border:none; border-radius:18px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; transition:transform .15s ease, opacity .2s ease; }
        .gate-btn:active { transform:scale(.97); }
        .gate-btn:disabled { opacity:.5; cursor:default; }
        /* ============ LIQUID GLASS (iOS style, pure CSS) ============ */
        :root {
            --lg-fill: linear-gradient(145deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.13) 100%);
            --lg-border: rgba(255,255,255,0.2);
            --lg-edge: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.1), inset 0 0 14px rgba(255,255,255,0.07);
            --lg-blur: blur(18px) saturate(180%) brightness(1.1);
            --lg-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .hero-card, .gate-card {
            background:
                radial-gradient(circle at 18% 80%, rgba(255,255,255,0.20), transparent 38%),
                radial-gradient(circle at 88% 72%, rgba(255,255,255,0.15), transparent 34%),
                radial-gradient(circle at 62% 14%, rgba(255,255,255,0.10), transparent 42%),
                linear-gradient(to bottom, var(--bg-hero-1), var(--bg-hero-2));
        }
        .glass-btn, .qr-circle-btn, .bell-btn, .avatar, .store-btn,
        .member-pill-inner, .today-pill, .gate-input {
            background: var(--lg-fill);
            backdrop-filter: var(--lg-blur);
            -webkit-backdrop-filter: var(--lg-blur);
            border: 1px solid var(--lg-border);
            box-shadow: var(--lg-edge), 0 8px 24px rgba(0,0,0,0.35);
        }
        .nav-pill {
            background: linear-gradient(145deg, rgba(60,60,66,0.58), rgba(14,14,16,0.52));
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--lg-border);
            box-shadow: var(--lg-edge), 0 12px 34px rgba(0,0,0,0.3);
        }
        .bottom-sheet {
            background: linear-gradient(to bottom, rgba(255,255,255,0.86), rgba(255,255,255,0.74));
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.18);
        }
        /* ============ QR SCANNER ============ */
        .scan-btn { flex-shrink:0; width:46px; height:46px; margin-right:10px; border:none; border-radius:16px; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .25s cubic-bezier(0.34,1.56,0.64,1); }
        .scan-btn:active { transform:scale(0.9); }
        .scan-btn svg { width:22px; height:22px; }
        .scanner { position:absolute; inset:0; z-index:95; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center; }
        .scanner.open { display:flex; }
        .scanner video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
        .scan-frame { position:relative; width:230px; height:230px; border-radius:28px; border:3px solid rgba(255,255,255,0.9); box-shadow:0 0 0 999px rgba(0,0,0,0.55); }
        .scan-msg { position:absolute; left:20px; right:20px; bottom:110px; text-align:center; color:#fff; font-size:15px; font-weight:500; line-height:1.4; text-shadow:0 1px 6px rgba(0,0,0,0.6); }
        .scan-close { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); padding:14px 34px; border-radius:999px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.16); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); color:#fff; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer; }
    </style>
</head>
<body>
    <!-- ============ IPHONE FRAME ============ -->
    <div class="phone-frame">
        <!-- ============ QR SCANNER ============ -->
        <div class="scanner" id="scanner">
            <video id="scan-video" playsinline muted></video>
            <div class="scan-frame"></div>
            <div class="scan-msg" id="scan-msg"></div>
            <button class="scan-close" id="scan-close" type="button">Cancel</button>
        </div>
        <!-- ============ CASHIER LOGIN ============ -->
        <div class="gate" id="gate">
            <div class="gate-card">
                <div class="gate-title">Cashier login</div>
                <div class="gate-sub">Sign in to add points</div>
                <input class="gate-input" id="gate-email" type="email" placeholder="Email" autocomplete="username">
                <input class="gate-input" id="gate-password" type="password" placeholder="Password" autocomplete="current-password">
                <div class="gate-error" id="gate-error"></div>
                <button class="gate-btn" id="gate-btn">Sign in</button>
            </div>
        </div>
        <div class="app-scroll" id="app-scroll">
            <!-- ============ HERO CARD ============ -->
            <div class="hero-card">
                <div class="hero-top">
                    <div class="store-block">
                        <div class="store-name" id="store-name">Fruity Bros</div>
                        <div class="cashier-label">Cashier</div>
                    </div>
                    <div class="today-pill">
                        <span class="dot"></span>
                        <span id="today-count">0 customers today</span>
                    </div>
                </div>
                <div class="hero-heading">Add points</div>
                <div class="hero-sub">Enter phone number and bill amount</div>
            </div>
            <!-- ============ FORM ============ -->
            <div class="form-section" id="form-section">
                <!-- Phone -->
                <div class="field-group">
                    <label class="field-label" for="phone-input">Customer phone</label>
                    <div class="input-wrap" id="phone-wrap">
                        <input
                            class="big-input"
                            id="phone-input"
                            type="tel"
                            inputmode="numeric"
                            placeholder="01XXXXXXXXX"
                            autocomplete="off"
                            maxlength="11"
                        >
                        <button class="scan-btn" id="scan-btn" type="button" aria-label="Scan customer QR code">
                            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2M7 12h10"/></svg>
                        </button>
                    </div>
                    <div class="lookup-result" id="lookup-result"></div>
                    <div class="field-error" id="phone-error"></div>
                </div>
                <!-- Bill amount -->
                <div class="field-group">
                    <label class="field-label" for="bill-input">Bill amount</label>
                    <div class="input-wrap" id="bill-wrap">
                        <span class="input-prefix">&#2547;</span>
                        <input
                            class="big-input"
                            id="bill-input"
                            type="text"
                            inputmode="decimal"
                            placeholder="0"
                            autocomplete="off"
                        >
                    </div>
                    <div class="field-error" id="bill-error"></div>
                </div>
                <!-- Quick Bill Presets -->
                <div class="quick-presets">
                    <button type="button" class="preset-chip" data-amt="100">৳100</button>
                    <button type="button" class="preset-chip" data-amt="200">৳200</button>
                    <button type="button" class="preset-chip" data-amt="500">৳500</button>
                    <button type="button" class="preset-chip" data-amt="1000">৳1000</button>
                </div>
                <!-- Live preview -->
                <div class="preview-line" id="preview-line" style="visibility:hidden;">
                    <span class="dot"></span>
                    <span>This will add <strong id="preview-points">+0 pts</strong></span>
                </div>
                <!-- Reward-ready pill -->
                <div class="reward-pill" id="reward-pill">
                    <div class="reward-pill-left">
                        <span class="dot"></span>
                        <span id="reward-pill-text">Reward ready: Free coffee</span>
                    </div>
                    <button class="redeem-btn" id="redeem-btn">Redeem</button>
                </div>
                <!-- Confirm -->
                <button class="confirm-btn" id="confirm-btn" disabled>Confirm</button>
            </div>
            <!-- ============ SUCCESS STATE ============ -->
            <div class="success-card" id="success-card">
                <div class="success-check">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <div class="success-title" id="success-title">+40 pts added to Rahim</div>
                <div class="success-sub" id="success-sub">New total: 460 pts</div>
                <div class="success-actions">
                    <button class="next-btn" id="next-btn">Next customer</button>
                    <button class="undo-btn" id="undo-btn">
                        Undo <span class="undo-countdown" id="undo-countdown"></span>
                    </button>
                </div>
            </div>
            <!-- ============ TODAY'S ACTIVITY ============ -->
            <div class="activity-section">
                <div class="section-header">
                    <h2 class="section-title">Today</h2>
                </div>
                <div class="activity-list" id="activity-list">
                    <div class="empty-note" id="empty-note">No activity yet today.</div>
                </div>
            </div>
        </div>
        <!-- ============ BOTTOM NAV ============ -->
        <div class="bottom-nav">
            <div class="nav-pill">
                <button class="nav-btn active" data-tab="add" title="Add points">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M12 4v16m8-8H4"/>
                    </svg>
                </button>
                <button class="nav-btn" data-tab="history" title="History">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </button>
                <button class="nav-btn" data-tab="settings" title="Settings">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
            </div>
        </div>
        <!-- ============ BOTTOM SHEET ============ -->
        <div class="sheet-backdrop" id="sheet-backdrop"></div>
        <div class="bottom-sheet" id="bottom-sheet">
            <div class="sheet-handle" id="sheet-handle"></div>
            <div id="sheet-content"></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
    <script type="module">
import {
    isConfigured, STORE, db, auth, doc, getDoc, setDoc, onSnapshot, collection,
    query, orderBy, where, runTransaction,
    onAuthStateChanged, signInWithEmailAndPassword, signOut
} from './firebase.js';

/* ============ STATE ============ */
let currentCustomer = null;     // customer doc for the typed phone (null = new or unknown)
let lookupFor = '';             // phone that currentCustomer was resolved for
let todayLog = [];              // today's log entries, newest first
let todayCount = 0;
let lastTransaction = null;     // for the Undo button
let undoTimer = null;
let unsubLog = null;
let busy = false;
const customerCache = new Map(); // Local cache for instant repeat lookups
let storeConfig = {
    name: STORE.name,
    rewardCost: STORE.rewardCost || 500,
    rewardName: STORE.rewardName || 'Reward',
    takaPerPoint: STORE.takaPerPoint || 10,
    reviewUrl: STORE.reviewUrl || ''
};
function activeRewardCost() { return Math.max(1, Number(storeConfig.rewardCost) || 500); }
function activeRewardName() { return String(storeConfig.rewardName || 'Reward').trim() || 'Reward'; }
function activeTakaPerPoint() { return Math.max(1, Number(storeConfig.takaPerPoint) || 10); }
function activeReviewUrl() { return String(storeConfig.reviewUrl || '').trim(); }

/* ============ DOM REFERENCES ============ */
const $ = (id) => document.getElementById(id);
const phoneInput = $('phone-input');
const billInput = $('bill-input');
const phoneWrap = $('phone-wrap');
const billWrap = $('bill-wrap');
const phoneError = $('phone-error');
const billError = $('bill-error');
const lookupResult = $('lookup-result');
const previewLine = $('preview-line');
const previewPoints = $('preview-points');
const confirmBtn = $('confirm-btn');
const rewardPill = $('reward-pill');
const rewardPillText = $('reward-pill-text');
const formSection = $('form-section');
const successCard = $('success-card');
const successTitle = $('success-title');
const successSub = $('success-sub');
const nextBtn = $('next-btn');
const undoBtn = $('undo-btn');
const undoCountdown = $('undo-countdown');
const activityList = $('activity-list');
const emptyNote = $('empty-note');
const todayCountEl = $('today-count');
const sheetBackdrop = $('sheet-backdrop');
const bottomSheet = $('bottom-sheet');
const sheetContent = $('sheet-content');
const sheetHandle = $('sheet-handle');
const gate = $('gate');
const gateEmail = $('gate-email');
const gatePassword = $('gate-password');
const gateBtn = $('gate-btn');
const gateError = $('gate-error');

/* ============ HELPERS ============ */
function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pointsForBill(amount) { return Math.floor(amount / activeTakaPerPoint()); }
function timeOf(ts) { return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function storePoints(c) { return (c && c.points && c.points[STORE.id]) || 0; }
function isValidPhone(p) { return /^01\d{9}$/.test(p); }
function isValidBill(b) { return b > 0; }
function setError(wrapEl, errorEl, message) {
    if (message) {
        wrapEl.classList.add('error');
        errorEl.textContent = message;
        errorEl.classList.add('visible');
    } else {
        wrapEl.classList.remove('error');
        errorEl.classList.remove('visible');
    }
}

/* ============ LOGIN ============ */
function friendlyAuthError(code) {
    if (code === 'auth/network-request-failed') return 'No internet. Please try again.';
    if (code === 'auth/too-many-requests') return 'Too many tries. Wait a minute and try again.';
    return 'Wrong email or password.';
}
async function submitLogin() {
    const email = gateEmail.value.trim();
    const pass = gatePassword.value;
    if (!email || !pass) { gateError.textContent = 'Enter email and password.'; return; }
    gateBtn.disabled = true;
    gateBtn.textContent = 'Signing in...';
    gateError.textContent = '';
    try {
        await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
        gateError.textContent = friendlyAuthError(e.code);
    }
    gateBtn.disabled = false;
    gateBtn.textContent = 'Sign in';
}
gateBtn.addEventListener('click', submitLogin);
gatePassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitLogin(); });

/* ============ DATABASE ACTIONS ============ */
async function applyPoints({ phone, pts, bill, type, title }) {
    const custRef = doc(db, 'customers', phone);
    const actRef = doc(collection(db, 'customers', phone, 'activity'));
    const logRef = doc(collection(db, 'log'));
    const ts = Date.now();
    const by = auth.currentUser ? auth.currentUser.email : '';
    return runTransaction(db, async (tx) => {
        const snap = await tx.get(custRef);
        const existing = snap.exists() ? snap.data() : null;
        const name = (existing && existing.name) || ('Customer ' + phone.slice(-4));
        const old = storePoints(existing);
        const total = old + pts;
        if (total < 0) throw new Error('not-enough-points');
        const data = { name, phone, points: { [STORE.id]: total } };
        if (!existing) data.createdAt = ts;
        tx.set(custRef, data, { merge: true });
        tx.set(actRef, { storeId: STORE.id, type, title, points: pts, bill: bill || 0, ts });
        tx.set(logRef, { storeId: STORE.id, phone, name, type, points: pts, bill: bill || 0, ts, by });
        return { name, total, actId: actRef.id, logId: logRef.id };
    });
}

async function undoTransaction(t) {
    const custRef = doc(db, 'customers', t.phone);
    return runTransaction(db, async (tx) => {
        const snap = await tx.get(custRef);
        if (snap.exists()) {
            const total = Math.max(0, storePoints(snap.data()) - t.pts);
            tx.set(custRef, { points: { [STORE.id]: total } }, { merge: true });
            customerCache.delete(t.phone); // Invalidate cache on undo
        }
        tx.delete(doc(db, 'customers', t.phone, 'activity', t.actId));
        tx.delete(doc(db, 'log', t.logId));
    });
}

async function lookupCustomer(phone) {
    lookupFor = '';
    currentCustomer = null;
    updateLookup();

    // Check memory cache first for instant repeat customer response
    if (customerCache.has(phone)) {
        currentCustomer = customerCache.get(phone);
        lookupFor = phone;
        updateLookup();
        updatePreview();
        return;
    }

    try {
        const snap = await getDoc(doc(db, 'customers', phone));
        if (phoneInput.value.trim() !== phone) return;
        currentCustomer = snap.exists() ? snap.data() : null;
        if (currentCustomer) {
            customerCache.set(phone, currentCustomer);
        }
        lookupFor = phone;
    } catch (e) {
        lookupFor = '';
    }
    updateLookup();
    updatePreview();
    syncRedeemOnlyMode();
}

/* ============ FORM UPDATES ============ */
function updateLookup() {
    const phone = phoneInput.value.trim();
    lookupResult.classList.remove('new-customer');
    if (phone.length !== STORE_PHONE_LENGTH || lookupFor !== phone) {
        lookupResult.classList.remove('visible');
        return;
    }
    if (currentCustomer) {
        lookupResult.innerHTML = `<span class="dot"></span><span>${esc(currentCustomer.name)} - ${storePoints(currentCustomer)} pts</span>`;
    } else {
        lookupResult.classList.add('new-customer');
        lookupResult.innerHTML = `<span class="dot"></span><span>New customer</span>`;
    }
    lookupResult.classList.add('visible');
}

const STORE_PHONE_LENGTH = 11;

function updatePreview() {
    const bill = parseFloat(billInput.value) || 0;
    if (bill > 0) {
        previewPoints.textContent = `+${pointsForBill(bill)} pts`;
        previewLine.style.visibility = 'visible';
    } else {
        previewLine.style.visibility = 'hidden';
    }
    const phone = phoneInput.value.trim();
    if (currentCustomer && lookupFor === phone && storePoints(currentCustomer) >= activeRewardCost()) {
        rewardPillText.textContent = `Reward ready: ${activeRewardName()}`;
        rewardPill.classList.add('visible');
    } else {
        rewardPill.classList.remove('visible');
    }
}

function updateConfirmState() {
    const ok = isValidPhone(phoneInput.value.trim()) && isValidBill(parseFloat(billInput.value) || 0);
    confirmBtn.disabled = !ok || busy;
}

phoneInput.addEventListener('input', () => {
    phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, STORE_PHONE_LENGTH);
    setError(phoneWrap, phoneError, null);
    const phone = phoneInput.value;
    if (phone.length === STORE_PHONE_LENGTH) {
        lookupCustomer(phone);
        billInput.focus(); // Instantly jump focus to bill input
    } else {
        lookupFor = '';
        currentCustomer = null;
        updateLookup();
        updatePreview();
    }
    updateConfirmState();
});

billInput.addEventListener('input', () => {
    billInput.value = billInput.value.replace(/[^\d.]/g, '');
    const parts = billInput.value.split('.');
    if (parts.length > 2) billInput.value = parts[0] + '.' + parts.slice(1).join('');
    setError(billWrap, billError, null);
    updatePreview();
    updateConfirmState();
});

// Enter key shortcut on bill input for instant confirmation
billInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !confirmBtn.disabled) {
        confirmBtn.click();
    }
});

// Enter key shortcut on success screen for instant "Next customer"
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && successCard.classList.contains('visible')) {
        nextBtn.click();
    }
});

// Preset chips event listeners
document.querySelectorAll('.preset-chip').forEach(btn => {
    btn.addEventListener('click', () => {
        billInput.value = btn.dataset.amt;
        updatePreview();
        updateConfirmState();
        confirmBtn.focus();
    });
});

/* ============ CONFIRM ============ */
confirmBtn.addEventListener('click', async () => {
    const phone = phoneInput.value.trim();
    const bill = parseFloat(billInput.value) || 0;
    if (!isValidPhone(phone)) {
        setError(phoneWrap, phoneError, 'Enter a valid 11-digit phone number starting with 01.');
        phoneInput.focus();
        return;
    }
    if (!isValidBill(bill)) {
        setError(billWrap, billError, 'Bill amount must be greater than 0.');
        billInput.focus();
        return;
    }
    const pts = pointsForBill(bill);
    if (pts <= 0) {
        setError(billWrap, billError, `Bill is too small. ৳${activeTakaPerPoint()} gives 1 point.`);
        return;
    }
    busy = true;
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Saving...';
    try {
        const res = await applyPoints({ phone, pts, bill, type: 'purchase', title: 'Purchase' });
        // Update local cache with new total
        if (currentCustomer && lookupFor === phone) {
            currentCustomer.points = { [STORE.id]: res.total };
            customerCache.set(phone, currentCustomer);
        }
        lastTransaction = { phone, pts, actId: res.actId, logId: res.logId };
        successTitle.textContent = `+${pts} pts added to ${res.name}`;
        successSub.textContent = `New total: ${res.total} pts`;
        formSection.style.display = 'none';
        successCard.classList.add('visible');
        startUndoTimer();
    } catch (e) {
        setError(billWrap, billError, 'Could not save. Check internet and try again.');
    }
    busy = false;
    confirmBtn.textContent = 'Confirm';
    updateConfirmState();
});

/* ============ UNDO ============ */
function startUndoTimer() {
    clearInterval(undoTimer);
    undoBtn.classList.remove('hidden');
    let left = 10;
    undoCountdown.textContent = `(${left}s)`;
    undoTimer = setInterval(() => {
        left--;
        undoCountdown.textContent = `(${left}s)`;
        if (left <= 0) {
            clearInterval(undoTimer);
            undoBtn.classList.add('hidden');
            lastTransaction = null;
        }
    }, 1000);
}

undoBtn.addEventListener('click', async () => {
    if (!lastTransaction) return;
    const t = lastTransaction;
    lastTransaction = null;
    clearInterval(undoTimer);
    undoBtn.classList.add('hidden');
    try {
        await undoTransaction(t);
    } catch (e) {}
    resetToForm();
});

/* ============ NEXT CUSTOMER ============ */
nextBtn.addEventListener('click', resetToForm);

function setRedeemOnlyView(enabled) {
    const billGroup = billInput ? billInput.closest('.field-group') : null;
    const presetsEl = document.querySelector('.quick-presets');
    if (billGroup) billGroup.style.display = enabled ? 'none' : '';
    if (presetsEl) presetsEl.style.display = enabled ? 'none' : '';
    if (previewLine) previewLine.style.display = enabled ? 'none' : '';
    if (confirmBtn) confirmBtn.style.display = enabled ? 'none' : '';
}

function syncRedeemOnlyMode() {
    const phone = phoneInput.value.trim();
    const pts = storePoints(currentCustomer);
    const target = activeRewardCost();
    const hasReward = Boolean(currentCustomer && lookupFor === phone && pts >= target);
    setRedeemOnlyView(hasReward);
    if (hasReward) {
        rewardPillText.textContent = `Reward ready (${pts} pts): ${activeRewardName()}`;
        rewardPill.classList.add('visible');
    } else {
        rewardPill.classList.remove('visible');
    }
}

function resetToForm() {
    setRedeemOnlyView(false);
    clearInterval(undoTimer);
    undoBtn.classList.add('hidden');
    phoneInput.value = '';
    billInput.value = '';
    currentCustomer = null;
    lookupFor = '';
    lookupResult.classList.remove('visible');
    previewLine.style.visibility = 'hidden';
    rewardPill.classList.remove('visible');
    setError(phoneWrap, phoneError, null);
    setError(billWrap, billError, null);
    updateConfirmState();
    successCard.classList.remove('visible');
    formSection.style.display = '';
    phoneInput.focus();
}

/* ============ REDEEM ============ */
$('redeem-btn').addEventListener('click', () => {
    const phone = phoneInput.value.trim();
    if (!currentCustomer || lookupFor !== phone) return;
    const cost = activeRewardCost();
    const rName = activeRewardName();
    openSheet(`
        <div class="sheet-title">Redeem reward</div>
        <div class="sheet-subtitle">
            Use <strong>${cost} pts</strong> for one ${esc(rName)}?
            <br>${esc(currentCustomer.name)} has ${storePoints(currentCustomer)} pts.
        </div>
        <button class="sheet-btn" id="sheet-confirm-redeem">Confirm redeem</button>
        <button class="sheet-btn secondary" onclick="closeSheet()">Cancel</button>
    `);
    $('sheet-confirm-redeem').addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
            await applyPoints({ phone, pts: -cost, type: 'redeem', title: 'Redeemed free item' });
            customerCache.delete(phone); // Invalidate cache
            closeSheet();
            await lookupCustomer(phone);
        } catch (e) {
            btn.disabled = false;
            btn.textContent = 'Could not save. Try again';
        }
    });
});

/* ============ BOTTOM SHEET ============ */
function openSheet(html) {
    sheetContent.innerHTML = html;
    sheetBackdrop.classList.add('open');
    bottomSheet.classList.add('open');
}
function closeSheet() {
    sheetBackdrop.classList.remove('open');
    bottomSheet.classList.remove('open');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'add'));
}
window.closeSheet = closeSheet;
sheetBackdrop.addEventListener('click', closeSheet);

let touchStartY = 0;
sheetHandle.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
sheetHandle.addEventListener('touchmove', (e) => {
    const delta = e.touches[0].clientY - touchStartY;
    if (delta > 0) bottomSheet.style.transform = `translateY(${delta}px)`;
}, { passive: true });
sheetHandle.addEventListener('touchend', (e) => {
    const delta = e.changedTouches[0].clientY - touchStartY;
    bottomSheet.style.transform = '';
    if (delta > 80) closeSheet();
});

/* ============ BOTTOM NAV ============ */
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (tab === 'history') {
            openSheet(`
                <div class="sheet-title">History</div>
                <div class="sheet-subtitle">Coming soon in the next version.</div>
                <button class="sheet-btn" onclick="closeSheet()">OK</button>
            `);
        } else if (tab === 'settings') {
            openSheet(`
                <div class="sheet-title">Store settings</div>
                <div class="sheet-subtitle" style="margin-bottom:14px;">Updates apply live to customer cards</div>
                <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;text-align:left;">
                    <div>
                        <label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;">Free reward name</label>
                        <input id="cfg-reward-name" type="text" value="${esc(activeRewardName())}" style="width:100%;padding:11px 12px;border-radius:12px;border:1px solid #d1d5db;background:#fff;font-size:14px;font-family:inherit;">
                    </div>
                    <div style="display:flex;gap:10px;">
                        <div style="flex:1;">
                            <label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;">Points needed</label>
                            <input id="cfg-reward-cost" type="number" min="1" step="1" value="${esc(activeRewardCost())}" style="width:100%;padding:11px 12px;border-radius:12px;border:1px solid #d1d5db;background:#fff;font-size:14px;font-family:inherit;">
                        </div>
                        <div style="flex:1;">
                            <label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;">Taka per 1 point</label>
                            <input id="cfg-taka-per-point" type="number" min="1" step="1" value="${esc(activeTakaPerPoint())}" style="width:100%;padding:11px 12px;border-radius:12px;border:1px solid #d1d5db;background:#fff;font-size:14px;font-family:inherit;">
                        </div>
                    </div>
                    <div>
                        <label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;">Google review link</label>
                        <input id="cfg-review-url" type="url" placeholder="https://g.page/r/..." value="${esc(activeReviewUrl())}" style="width:100%;padding:11px 12px;border-radius:12px;border:1px solid #d1d5db;background:#fff;font-size:14px;font-family:inherit;">
                    </div>
                </div>
                <div id="cfg-status" style="min-height:18px;font-size:12px;font-weight:600;color:#555;text-align:center;margin-bottom:10px;"></div>
                <button class="sheet-btn" id="save-store-cfg-btn">Save settings</button>
                <div style="margin-top:12px;text-align:center;font-size:12px;color:#6b7280;">Signed in as <strong>${esc(auth.currentUser ? auth.currentUser.email : '')}</strong></div>
                <button class="sheet-btn secondary" id="sign-out-btn">Sign out</button>
            `);
            $('save-store-cfg-btn').addEventListener('click', async (ev) => {
                const btn = ev.currentTarget;
                const statusEl = $('cfg-status');
                const nextRewardName = ($('cfg-reward-name').value || '').trim();
                const nextRewardCost = parseInt($('cfg-reward-cost').value, 10);
                const nextTakaPerPoint = parseInt($('cfg-taka-per-point').value, 10);
                const nextReviewUrl = ($('cfg-review-url').value || '').trim();
                if (!nextRewardName) { statusEl.style.color = '#ef4444'; statusEl.textContent = 'Enter a reward name.'; return; }
                if (!Number.isFinite(nextRewardCost) || nextRewardCost < 1) { statusEl.style.color = '#ef4444'; statusEl.textContent = 'Points needed must be at least 1.'; return; }
                if (!Number.isFinite(nextTakaPerPoint) || nextTakaPerPoint < 1) { statusEl.style.color = '#ef4444'; statusEl.textContent = 'Taka per point must be at least 1.'; return; }
                btn.disabled = true;
                btn.textContent = 'Saving...';
                statusEl.style.color = '#555';
                statusEl.textContent = '';
                try {
                    const payload = {
                        name: storeConfig.name || STORE.name,
                        rewardName: nextRewardName,
                        rewardCost: nextRewardCost,
                        takaPerPoint: nextTakaPerPoint,
                        reviewUrl: nextReviewUrl
                    };
                    await setDoc(doc(db, 'stores', STORE.id), payload, { merge: true });
                    storeConfig = { ...storeConfig, ...payload };
                    updatePreview();
                    syncRedeemOnlyMode();
                    statusEl.style.color = '#16a34a';
                    statusEl.textContent = 'Saved!';
                } catch (e) {
                    statusEl.style.color = '#ef4444';
                    statusEl.textContent = 'Could not save settings. Check connection & rules.';
                }
                btn.disabled = false;
                btn.textContent = 'Save settings';
            });
            $('sign-out-btn').addEventListener('click', () => { closeSheet(); signOut(auth); });
        }
    });
});

/* ============ TODAY'S LIST (live) ============ */
function renderActivity() {
    activityList.querySelectorAll('.activity-item').forEach(el => el.remove());
    if (todayLog.length === 0) { emptyNote.style.display = ''; return; }
    emptyNote.style.display = 'none';
    const icons = {
        purchase: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12m-3-9h6a2 2 0 012 2v5a2 2 0 01-2 2H9a2 2 0 01-2-2v-5a2 2 0 012-2z"/></svg>',
        redeem: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 010 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>'
    };
    todayLog.slice(0, 5).forEach(entry => {
        const row = document.createElement('div');
        row.className = 'activity-item';
        row.innerHTML = `
            <div class="activity-icon">${icons[entry.type] || icons.purchase}</div>
            <div class="activity-info">
                <div class="activity-title">${esc(entry.name)}</div>
                <div class="activity-date">${timeOf(entry.ts)}</div>
            </div>
            <div class="activity-points ${entry.points < 0 ? 'negative' : ''}">
                ${entry.points > 0 ? '+' : ''}${entry.points} pts
            </div>`;
        activityList.appendChild(row);
    });
}
function updateTodayCount() {
    todayCountEl.textContent = `${todayCount} customer${todayCount === 1 ? '' : 's'} today`;
}

function startLogListener() {
    if (unsubLog) unsubLog();
    const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
    unsubLog = onSnapshot(
        query(collection(db, 'log'), where('ts', '>=', startOfDay.getTime()), orderBy('ts', 'desc')),
        (snap) => {
            todayLog = snap.docs.map(d => d.data()).filter(e => e.storeId === STORE.id);
            todayCount = todayLog.filter(e => e.type === 'purchase').length;
            renderActivity();
            updateTodayCount();
        }
    );
}

/* ============ AUTH STATE ============ */
if (!isConfigured) {
    gateError.textContent = 'Setup needed: paste your Firebase config into firebase-config.js.';
    gateBtn.disabled = true;
} else {
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            gate.classList.add('hidden');
            gatePassword.value = '';
            startLogListener();
            try {
                const storeRef = doc(db, 'stores', STORE.id);
                const snap = await getDoc(storeRef);
                if (snap.exists()) {
                    const d = snap.data();
                    storeConfig = {
                        name: d.name || STORE.name,
                        rewardCost: Number(d.rewardCost) || STORE.rewardCost || 500,
                        rewardName: d.rewardName || STORE.rewardName || 'Reward',
                        takaPerPoint: Number(d.takaPerPoint) || STORE.takaPerPoint || 10,
                        reviewUrl: d.reviewUrl || ''
                    };
                } else {
                    await setDoc(storeRef, {
                        name: STORE.name, rewardCost: STORE.rewardCost,
                        rewardName: STORE.rewardName, takaPerPoint: STORE.takaPerPoint,
                        reviewUrl: STORE.reviewUrl
                    }, { merge: true });
                }
            } catch (e) {
                gateError.textContent = '';
            }
        } else {
            if (unsubLog) { unsubLog(); unsubLog = null; }
            gate.classList.remove('hidden');
        }
    });
}

/* ============ QR SCANNER ============ */
const scanner = $('scanner');
const scanVideo = $('scan-video');
const scanMsg = $('scan-msg');
const scanCanvas = document.createElement('canvas');
const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
let detector = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
let scanStream = null, scanRaf = null, scanning = false;

function normalizePhone(text) {
    let d = String(text).replace(/\D/g, '');
    if (d.startsWith('880') && d.length === 13) d = '0' + d.slice(3);
    return d;
}
async function openScanner() {
    scanMsg.textContent = "Point the camera at the customer's QR code";
    scanner.classList.add('open');
    try {
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        scanVideo.srcObject = scanStream;
        await scanVideo.play();
        scanning = true;
        scanLoop();
    } catch (e) {
        scanMsg.textContent = 'Camera not available. Allow camera permission, or type the number.';
    }
}
function closeScanner() {
    scanning = false;
    cancelAnimationFrame(scanRaf);
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    scanVideo.srcObject = null;
    scanner.classList.remove('open');
}
async function scanLoop() {
    if (!scanning) return;
    if (scanVideo.readyState >= 2 && scanVideo.videoWidth) {
        let text = null;
        try {
            if (detector) {
                const codes = await detector.detect(scanVideo);
                if (codes.length) text = codes[0].rawValue;
            } else if (window.jsQR) {
                const scale = Math.min(1, 480 / scanVideo.videoWidth);
                scanCanvas.width = Math.round(scanVideo.videoWidth * scale);
                scanCanvas.height = Math.round(scanVideo.videoHeight * scale);
                scanCtx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
                const img = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                const code = jsQR(img.data, img.width, img.height);
                if (code) text = code.data;
            }
        } catch (e) { detector = null; }
        if (text) {
            const phone = normalizePhone(text);
            if (isValidPhone(phone)) { onScanned(phone); return; }
            scanMsg.textContent = 'This is not a customer code. Try again.';
        }
    }
    if (scanning) scanRaf = requestAnimationFrame(scanLoop);
}
async function onScanned(phone) {
    closeScanner();
    phoneInput.value = phone.replace(/\D/g, '').slice(0, STORE_PHONE_LENGTH);
    setError(phoneWrap, phoneError, null);
    await lookupCustomer(phoneInput.value);
    updateConfirmState();
    const pts = storePoints(currentCustomer);
    if (!(currentCustomer && lookupFor === phoneInput.value && pts >= activeRewardCost())) {
        billInput.focus();
    }
}
$('scan-btn').addEventListener('click', openScanner);
$('scan-close').addEventListener('click', closeScanner);

/* ============ INIT ============ */
$('store-name').textContent = STORE.name;
updateTodayCount();
updateConfirmState();
    </script>
